name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to fetch main's last bundle-size artifact as a baseline
    steps:
      # So the last step can report this job's wall time against a target.
      - id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      # Full history: the build generates the changelog from git log.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      # Browsers are tied to the Playwright version, so key the cache on the
      # version the lockfile pins rather than the semver range.
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The same setup a new machine or a Claude Code cloud session runs. It
      # skips the browser download when the cache restored it.
      - run: scripts/setup.sh
      - run: npm run check
      # Fails only on high/critical advisories; moderate ones are tracked in
      # SECURITY.md instead of blocking every PR on a transitive dep.
      - run: npm audit --audit-level=high
      # Builds dist (typecheck already ran in check) and runs the acceptance
      # tests against it. The deploy jobs ship this exact build. On a pull
      # request github.sha is GitHub's temporary merge commit, so the build
      # info names the branch's head commit instead.
      - run: npm run test:e2e
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Compares this build's gzipped size against main's own last measurement
      # (uploaded below); a fork PR or this budget's own first run has none,
      # and the script degrades to reporting absolute sizes only.
      - name: Fetch bundle size baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --json databaseId --limit 1 --jq '.[0].databaseId // empty')
          [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n bundle-size -D baseline || true
      - run: node scripts/bundle-size.mjs baseline/bundle-size.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.ref == 'refs/heads/main'
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 1
      # Advisory only: warns instead of failing so a slow network day doesn't
      # block a merge.
      - name: Report job duration
        if: always()
        run: |
          target=50
          elapsed=$(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))
          echo "check job took ${elapsed}s (target: ${target}s)" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > target )); then
            echo "::warning::check job took ${elapsed}s, over the ${target}s target"
          fi

  # Secrets aren't available to PRs from forks, so only same-repo PRs get a preview.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # Full history: e2e/security-headers.spec.ts starts its own `vite
      # preview` server below, which loads vite.config.ts and regenerates the
      # changelog.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - id: tools
        run: echo "version=$(jq -r '.devDependencies["firebase-tools"]' package.json)" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_TRACKER_2C66F }}
          firebaseToolsVersion: ${{ steps.tools.outputs.version }}
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: scripts/setup.sh
      # Checks the headers firebase.json sends and that the app still renders
      # under its CSP, against the preview `deploy` just created.
      - run: npx playwright test e2e/security-headers.spec.ts
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
      # Budgets in lighthouserc.json; 3 runs, median taken, against the real
      # deployed build on Firebase's CDN, not a dev server.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: ${{ steps.deploy.outputs.details_url }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
      # The PR body goes through env, never into the script text, so its
      # contents can't run as shell.
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT: |-
            PR: ${{ github.event.pull_request.html_url }}
            Preview: ${{ steps.deploy.outputs.details_url }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: node .github/scripts/trello-comment.mjs

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue live deploys instead of running them side by side, so an older build
    # can never finish last and overwrite a newer one.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - id: tools
        run: echo "version=$(jq -r '.devDependencies["firebase-tools"]' package.json)" >> "$GITHUB_OUTPUT"
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_TRACKER_2C66F }}
          firebaseToolsVersion: ${{ steps.tools.outputs.version }}
          channelId: live
