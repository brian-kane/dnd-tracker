name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # Browsers are tied to the Playwright version, so key the cache on the
      # version actually installed rather than the semver range.
      - id: playwright
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - id: browsers-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The cache holds the browser but not its system libraries.
      - if: steps.browsers-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Builds dist (typecheck already ran in check) and runs the acceptance
      # tests against it. The deploy jobs ship this exact build.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # Secrets aren't available to PRs from forks, so only same-repo PRs get a preview.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: tools
        run: echo "version=$(jq -r '.devDependencies["firebase-tools"]' package.json)" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_TRACKER_2C66F }}
          firebaseToolsVersion: ${{ steps.tools.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # The PR body goes through env, never into the script text, so its
      # contents can't run as shell.
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMENT: |-
            PR: ${{ github.event.pull_request.html_url }}
            Preview: ${{ steps.deploy.outputs.details_url }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: node .github/scripts/trello-comment.mjs

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue live deploys instead of running them side by side, so an older build
    # can never finish last and overwrite a newer one.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: tools
        run: echo "version=$(jq -r '.devDependencies["firebase-tools"]' package.json)" >> "$GITHUB_OUTPUT"
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_TRACKER_2C66F }}
          firebaseToolsVersion: ${{ steps.tools.outputs.version }}
          channelId: live
