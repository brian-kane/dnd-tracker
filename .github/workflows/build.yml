name: Build

# Turns an approved card (fully templated, sitting in Up Next) into a PR, with no local
# machine involved — dispatched manually with a card link, or on a schedule that picks
# the top eligible card itself. `fetch-card` is the only job holding Trello credentials;
# `build` never sees them, so a misbehaving or compromised agent step can't read or
# write Trello.
on:
  workflow_dispatch:
    inputs:
      card:
        description: Trello card URL (must be in Up Next); leave empty to auto-pick
        required: false
  schedule:
    # Three times a day; each run builds at most one card, capping it at three a day.
    - cron: '0 */8 * * *'

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  fetch-card:
    if: github.event_name != 'schedule' || vars.BUILD_PAUSED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - id: select
        env:
          CARD_URL: ${{ inputs.card }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/trello-fetch-card.mjs
      - if: steps.select.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: card
          path: card.json
          retention-days: 1

  build:
    needs: fetch-card
    if: success() && needs.fetch-card.outputs.selected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # to fetch the GitHub App's OIDC token, so the PR it opens triggers ci.yml (GITHUB_TOKEN-opened PRs don't)
    outputs:
      pr_opened: ${{ steps.verify.outputs.pr_opened }}
    steps:
      - id: run-meta
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Full history: /card's branch and commit steps, and the changelog `build` reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: card
      # The same setup a new machine or a Claude Code cloud session runs.
      - run: scripts/setup.sh
      - id: claude
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read card.json in the repo root: it holds the Trello card this run was
            dispatched to build (name, desc, labels), already confirmed to be sitting
            in Up Next. You have no Trello access in this job — don't look for or try
            to use any Trello tool.

            Follow `.claude/skills/card/SKILL.md` steps 2 onward (Understand & plan,
            Build, Verify, Open the PR) and this repo's CLAUDE.md conventions, with
            these differences for this unattended run:
            - Skip step 1 (fetching and moving the card; already done for you) and
              step 7 (Ship). Stop once the PR is open.
            - Skip step 2's "stop and wait for approval" — dispatching this workflow
              with an approved card's link is the approval.
            - You're already on a full-history checkout of an up-to-date main; branch
              from HEAD instead of re-fetching origin/main.
            - If the card would need anything CLAUDE.md's "ask first" tier covers (a
              data-model change, a new dependency, a folder-structure change, a
              storage-format change, or anything touching CLAUDE.md or .claude/), or
              anything the card lists as out of scope, stop without making that
              change and say why in your final message instead of guessing.

            `npm run test:e2e` needs `VITE_WISH_EMAIL`; it's already set for you.

            Your only tools are the ones listed in `--allowedTools` below. If any tool
            call is denied, don't retry it or a variant of it — immediately fall back
            to a tool you have, or stop and explain what you were blocked on in your
            final message. There's no one here to answer an interactive prompt, so a
            denial is terminal for that approach, not a reason to keep trying.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run check:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run test:unit:*),Bash(npm run test:e2e:*),Bash(npm run lint:*),Bash(npm run format:*),Bash(npm run build:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git push:*),Bash(gh api repos/{owner}/{repo}/pulls *),Bash(gh api repos/{owner}/{repo}/pulls/*),Bash(gh api -X PATCH repos/{owner}/{repo}/pulls/*)"
        env:
          VITE_WISH_EMAIL: ${{ secrets.VITE_WISH_EMAIL }}
      - if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node .github/scripts/claude-run-report.mjs
      - id: verify
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STARTED_AT: ${{ steps.run-meta.outputs.started_at }}
        run: node .github/scripts/verify-pr-opened.mjs

  flag-no-pr:
    needs: [fetch-card, build]
    if: always() && needs.fetch-card.outputs.selected == 'true' && needs.build.outputs.pr_opened == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: card
      - env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/flag-no-pr.mjs
