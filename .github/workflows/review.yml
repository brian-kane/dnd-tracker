name: Review

# Advisory PR review against CLAUDE.md and the engineering principles. Runs
# once per PR (not on `synchronize`, to protect Pro usage limits) or on
# request via a "@claude review" comment from the repo owner. Always checks
# out main, never the PR's own branch: the PR's diff is fetched over the API
# (`gh pr diff`), so a PR can neither edit its own rules to pass review nor
# have its (possibly attacker-controlled) code checked out in a workflow that
# holds secrets.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # issue_comment also fires on plain issues; only the repo owner can
    # request a re-review, since anyone can comment on a public repo.
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required to fetch the GitHub App's OIDC token
    steps:
      - id: pr
        run: echo "number=${{ github.event.pull_request.number || github.event.issue.number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: .github/workflows/review.yml
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node .github/scripts/preflight-workflow-matches-main.mjs
      - id: claude
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs opened by our own build.yml are authored by the Claude
          # GitHub App, a bot actor the action blocks by default. Naming
          # only "claude" (not '*') keeps other Apps' PR/comment events out.
          allowed_bots: claude
          prompt: |
            Review pull request #${{ steps.pr.outputs.number }}'s diff
            (`gh pr diff ${{ steps.pr.outputs.number }}`) against this
            repo's CLAUDE.md and .claude/rules/engineering-principles.md.
            Post one PR comment (`gh pr comment ${{ steps.pr.outputs.number }}`)
            with your findings, or say explicitly that you found none.
            Findings are advisory, not blocking, so don't ask for changes
            or approve/request-changes.

            Your only tools are Read, Grep, Glob, and Bash restricted to
            plain `gh pr diff`, `gh pr view`, and `gh pr comment` calls —
            no `$(...)`, heredocs, pipes, `;`, `&&`, or redirects, since
            those inner commands are checked separately and will be
            denied. `gh pr diff` already prints the full diff to your
            output, so there's no need to redirect it to a file first;
            `gh pr view --json files --jq '.files[].path'` lists changed
            files without piping through other tools. Pass the comment
            body as a single quoted --body argument on the `gh pr
            comment` command line directly.

            The checkout is main, not the PR branch, so don't install
            dependencies, build, or run tests — you have no working copy
            of the PR's code to run them against, and CI's own `check`
            job already covers that. Review the diff as text.

            If any tool call is denied, don't retry it or a variant of
            it — immediately fall back to one of the allowed forms
            above. Only stop and explain what you were blocked on if
            none of them can do what you need.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node .github/scripts/claude-run-report.mjs

      - if: failure() && steps.preflight.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          gh pr comment "$PR_NUMBER" --body
          "Automated review failed to complete: $RUN_URL. Comment
          \`@claude review\` to retry."
